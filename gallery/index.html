<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2318" />
  <meta name="description" content="Photos from Ohlone Renegades Racing and our Formula SAE journey." />
  <title>Gallery — Ohlone Renegades Racing</title>
  <link rel="icon" href="https://ohloneracing.org/assets/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { renegade: { green: '#0B2318', greenMid: '#123525', greenLight: '#1B4D36', gold: '#F2A91E', goldHover: '#D99212' } }, fontFamily: { display: ['"Barlow Condensed"', 'sans-serif'], sans: ['Inter', 'sans-serif'] } } } };
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0B2318;
      background-image: radial-gradient(ellipse at 12% 6%, rgba(27,77,54,.72), transparent 38%), radial-gradient(ellipse at 88% 38%, rgba(18,53,37,.6), transparent 34%);
    }
    .grain { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E"); opacity:.18; pointer-events:none; }
    .gallery-card { animation: float-in .65s both cubic-bezier(.2,.8,.2,1); transform: translateY(var(--lift, 0px)) rotate(var(--tilt, 0deg)); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease; }
    .gallery-card:hover, .gallery-card:focus-within { transform: translateY(calc(var(--lift, 0px) - 9px)) rotate(0deg) scale(1.015); box-shadow: 0 28px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(242,169,30,.32); z-index: 2; }
    .gallery-card:nth-child(4n+1) { --tilt: -.8deg; --lift: 2px; }
    .gallery-card:nth-child(4n+2) { --tilt: .65deg; --lift: 18px; }
    .gallery-card:nth-child(4n+3) { --tilt: -.45deg; --lift: 8px; }
    .gallery-card:nth-child(4n) { --tilt: .9deg; --lift: 24px; }
    .markdown p { margin: .35rem 0; }
    .markdown a { color: #F2A91E; text-decoration: underline; text-underline-offset: 3px; }
    .markdown strong { color: #fff; font-weight: 700; }
    .markdown em { color: #f4d89d; }
    .markdown ul, .markdown ol { margin: .45rem 0 .45rem 1.25rem; }
    .markdown ul { list-style: disc; }
    .markdown ol { list-style: decimal; }
    .markdown code { border-radius: .25rem; background: rgba(255,255,255,.1); padding: .1rem .25rem; }
    dialog::backdrop { background: rgba(2,10,6,.88); backdrop-filter: blur(8px); }
    dialog[open] { animation: modal-in .22s ease-out; }
    @keyframes float-in { from { opacity:0; transform: translateY(26px) rotate(var(--tilt,0deg)) scale(.98); } to { opacity:1; transform: translateY(var(--lift,0px)) rotate(var(--tilt,0deg)) scale(1); } }
    @keyframes modal-in { from { opacity:0; transform:scale(.97); } to { opacity:1; transform:scale(1); } }
    @media (max-width: 640px) { .gallery-card:nth-child(n) { --lift: 0px; --tilt: 0deg; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body class="font-sans antialiased text-stone-100 selection:bg-renegade-gold selection:text-renegade-green">
  <div class="grain fixed inset-0 z-0" aria-hidden="true"></div>
  <header class="sticky top-0 z-20 border-b border-white/10 bg-renegade-green/80 backdrop-blur-xl">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5 sm:px-8">
      <a href="/" class="group flex items-center gap-3" aria-label="Ohlone Racing home">
        <span class="flex h-10 w-10 items-center justify-center rounded-full border border-renegade-gold/60 bg-renegade-greenMid font-display text-sm font-black italic text-renegade-gold shadow-lg shadow-black/20">OR</span>
        <span><span class="block font-display text-lg font-extrabold uppercase leading-none tracking-wider">Ohlone <b class="text-renegade-gold">Racing</b></span><span class="mt-1 block text-[9px] font-semibold uppercase tracking-[.22em] text-stone-400">Renegades FSAE</span></span>
      </a>
      <a href="/" class="rounded-full border border-white/15 px-4 py-2 text-xs font-semibold uppercase tracking-wider text-stone-300 transition hover:border-renegade-gold/70 hover:text-renegade-gold">← Back to site</a>
    </div>
  </header>

  <main class="relative z-10 mx-auto max-w-7xl px-5 pb-24 pt-14 sm:px-8 sm:pt-20">
    <section class="mb-10 flex flex-col justify-between gap-7 sm:mb-14 sm:flex-row sm:items-end">
      <div>
        <div class="mb-3 flex items-center gap-3"><span class="h-px w-8 bg-renegade-gold"></span><p class="font-display text-xs font-bold uppercase tracking-[.24em] text-renegade-gold">The season, in frames</p></div>
        <h1 class="font-display text-6xl font-black uppercase leading-[.88] tracking-tight sm:text-8xl">On the <span class="text-renegade-gold">track.</span><br />In the shop.</h1>
        <p class="mt-5 max-w-lg text-sm leading-6 text-stone-300 sm:text-base">A look at the people, process, and moments behind Ohlone Renegades Racing.</p>
      </div>
      <div class="flex items-center gap-3 self-start rounded-2xl border border-white/10 bg-white/[.04] px-4 py-3 sm:self-auto">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-renegade-gold/10 text-renegade-gold" aria-hidden="true">✳</span>
        <div><p id="photo-count" class="font-display text-xl font-bold leading-none">—</p><p class="mt-1 text-[10px] font-semibold uppercase tracking-[.16em] text-stone-400">Moments captured</p></div>
      </div>
    </section>

    <div id="gallery-status" role="status" class="rounded-2xl border border-white/10 bg-white/[.04] px-6 py-12 text-center text-sm text-stone-300">Loading the gallery…</div>
    <section id="gallery-grid" aria-label="Photo gallery" class="hidden grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></section>
  </main>

  <footer class="relative z-10 border-t border-white/10 px-5 py-7 text-center text-[10px] font-medium uppercase tracking-[.18em] text-stone-500">Ohlone Renegades Racing <span class="mx-2 text-renegade-gold">•</span> Formula SAE</footer>

  <dialog id="photo-dialog" class="m-auto max-h-[92vh] w-[min(94vw,1100px)] overflow-hidden rounded-2xl border border-white/15 bg-[#0b1b13] p-0 text-stone-100 shadow-2xl">
    <div class="relative grid max-h-[92vh] grid-cols-1 md:grid-cols-[1.5fr_1fr]">
      <div class="flex min-h-52 items-center justify-center bg-black/40"><img id="dialog-image" class="max-h-[72vh] w-full object-contain" alt="" /></div>
      <div class="overflow-y-auto p-6 sm:p-8"><button id="dialog-close" type="button" class="absolute right-3 top-3 z-10 flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-black/50 text-xl text-white hover:border-renegade-gold hover:text-renegade-gold" aria-label="Close image">×</button><p class="mb-2 font-display text-[10px] font-bold uppercase tracking-[.22em] text-renegade-gold">Renegades gallery</p><h2 id="dialog-title" class="pr-10 font-display text-4xl font-bold uppercase leading-none"></h2><div id="dialog-description" class="markdown mt-5 text-sm leading-6 text-stone-300"></div></div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
    const grid = document.querySelector('#gallery-grid');
    const status = document.querySelector('#gallery-status');
    const count = document.querySelector('#photo-count');
    const dialog = document.querySelector('#photo-dialog');
    const escapeHtml = (value) => (value || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])).replace(/\n/g, '<br>');
    const markdown = (value) => {
      if (!window.marked || !window.DOMPurify) return escapeHtml(value || '');
      return DOMPurify.sanitize(marked.parse(value || ''), { USE_PROFILES: { html: true } });
    };
    function openPhoto(photo) {
      document.querySelector('#dialog-image').src = photo.path;
      document.querySelector('#dialog-image').alt = photo.name;
      document.querySelector('#dialog-title').textContent = photo.name;
      document.querySelector('#dialog-description').innerHTML = markdown(photo.description);
      dialog.showModal();
    }
    function addPhoto(photo, index) {
      if (!photo || typeof photo.name !== 'string' || typeof photo.path !== 'string') return;
      const card = document.createElement('article');
      card.className = 'gallery-card overflow-hidden rounded-2xl border border-white/10 bg-[#10291d]/90 shadow-xl shadow-black/20';
      card.style.animationDelay = `${Math.min(index * 65, 520)}ms`;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'group block w-full text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-renegade-gold';
      button.setAttribute('aria-label', `View ${photo.name}`);
      const imageWrap = document.createElement('div');
      imageWrap.className = 'relative aspect-[4/3] overflow-hidden bg-renegade-greenMid';
      const image = document.createElement('img');
      image.src = photo.path;
      image.alt = photo.name;
      image.loading = 'lazy';
      image.className = 'h-full w-full object-cover transition duration-700 group-hover:scale-105';
      imageWrap.append(image);
      const overlay = document.createElement('div');
      overlay.className = 'absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-60 transition group-hover:opacity-100';
      imageWrap.append(overlay);
      const zoom = document.createElement('span');
      zoom.className = 'absolute bottom-3 right-3 flex h-9 w-9 items-center justify-center rounded-full border border-white/30 bg-black/30 text-lg text-white opacity-0 backdrop-blur transition group-hover:opacity-100 group-focus-visible:opacity-100';
      zoom.textContent = '+';
      imageWrap.append(zoom);
      const caption = document.createElement('div');
      caption.className = 'px-4 pb-4 pt-3';
      const title = document.createElement('h2');
      title.className = 'font-display text-xl font-bold uppercase tracking-wide text-white';
      title.textContent = photo.name;
      const description = document.createElement('div');
      description.className = 'markdown mt-1 line-clamp-3 text-xs leading-5 text-stone-400';
      description.innerHTML = markdown(photo.description);
      caption.append(title, description);
      button.append(imageWrap, caption);
      button.addEventListener('click', () => openPhoto(photo));
      card.append(button);
      grid.append(card);
    }
    document.querySelector('#dialog-close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && dialog.open) dialog.close(); });
    fetch('./pictures.json', { cache: 'no-store' })
      .then((response) => { if (!response.ok) throw new Error(`Could not load pictures.json (${response.status})`); return response.json(); })
      .then((photos) => {
        if (!Array.isArray(photos)) throw new Error('pictures.json must contain a JSON array.');
        photos.forEach(addPhoto);
        count.textContent = String(grid.childElementCount).padStart(2, '0');
        status.classList.add('hidden');
        if (!grid.childElementCount) {
          status.textContent = 'No photos yet. Add image entries to gallery/pictures.json to fill the gallery.';
          status.classList.remove('hidden');
        } else grid.classList.remove('hidden');
      })
      .catch((error) => { status.textContent = `${error.message} Make sure this page is served over HTTP or HTTPS.`; status.classList.add('border-red-300/20', 'text-red-200'); });
  </script>
</body>
</html>
